packaging_format = 2

id = "cypht"
name = "Cypht"
description.en = "Web interface to check your mailbox"
description.fr = "Interface web pour consulter votre boîte mail"

version = "2.14.0~ynh1"

maintainers = []

[upstream]
license = "LGPL-2.1-only"
website = "https://cypht.org"
admindoc = "https://cypht.org/install.html"
code = "https://github.com/cypht-org/cypht"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "200M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/cypht"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["de", "en", "es", "fr", "it", "nl", "pt-BR"]
    default = "fr"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources.main]
    url= "https://github.com/cypht-org/cypht/archive/refs/tags/v2.14.0.tar.gz"
    sha256 = "ae01c2d867e1a59c74fca2f8ee65641219bd41b9a06a7a0b1a8314e311ff7363"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["attachments", "users", "app_data"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, redis-server, php8.5-mbstring, php8.5-gnupg, php8.5-memcached, php8.5-mysql, php8.5-gd, php8.5-curl, php8.5-fileinfo php8.5-xml php8.5-soap php8.5-ldap php8.5-redis"

    [resources.database]
    type = "mysql"

    [resources.composer]
    version = "2.11.1"
